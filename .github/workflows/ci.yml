# Runs the whole test surface on every pull request and every push to main.
# It never deploys and never fetches from a live source: the pipeline tests
# use fixtures, and the site tests build against the committed data/ tree.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# The default token can only read. Nothing in this workflow writes to the
# repository, so a compromised dependency has nothing to abuse.
permissions:
  contents: read

# A newer push to the same ref makes the older run pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Tests that touch the snapshot store must not write into the
      # checkout, so the store is moved to the runner's scratch space.
      APTX_CACHE: ${{ runner.temp }}/aptx-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - name: Install the pipeline
        run: pip install -e "pipeline[test]"
      - name: Run pytest
        working-directory: pipeline
        run: python -m pytest -q

  site:
    name: site tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install dependencies
        working-directory: site
        run: npm ci
      - name: Type-check with svelte-check
        working-directory: site
        run: npm run check
      - name: Run vitest
        working-directory: site
        run: npm test
      # Playwright drives a production build under the real base path (see
      # playwright.config.ts), so this step also proves that the site builds.
      - name: Install the Playwright browser
        working-directory: site
        run: npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: site
        run: npx playwright test
